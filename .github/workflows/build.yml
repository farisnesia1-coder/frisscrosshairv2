
name: Build FRISS Crosshair APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRISS-CROSSHAIR-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q FRISS-CROSSHAIR-Project.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/FRISS-CROSSHAIR.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-CROSSHAIR-APK
          path: FRISS-CROSSHAIR.apk
          
